name: Release - Semantic Stable

on:
  push:
    branches: []

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  migration-check:
    name: Flyway Migration Check
    uses: ./.github/workflows/migrations-check.yml
    with:
      base_ref: ${{ github.event.before }}
      head_ref: ${{ github.sha }}
      checkout_ref: ${{ github.sha }}
#
#  test-suite:
#    name: Test Suite
#    needs: [migration-check]
#    uses: ./.github/workflows/test-suite.yml
#    permissions:
#      contents: read
#      checks: write
#    with:
#      checkout_ref: ${{ github.sha }}

  semantic-release:
    name: Compute Release, and Draft GitHub Release
    needs:
      - migration-check
      # - test-suite
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.semantic-release.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: just

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc

      - name: Set Up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11
          cache: true
          run_install: |
            - cwd: tools/release/
          package_json_file: tools/release/package.json

      - name: Install Release Tooling Dependencies
        run: just release install

      - name: Run semantic-release
        id: semantic-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' && secrets.RELEASE_BOT_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' && secrets.RELEASE_BOT_TOKEN || github.token }}
        run: |
          just release preview

#      - name: Run semantic-release
#        env:
#          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' && secrets.RELEASE_BOT_TOKEN || github.token }}
#          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' && secrets.RELEASE_BOT_TOKEN || github.token }}
#        run: just release run

  build-frontend:
    name: Build frontend
    needs:
      - semantic-release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Set Up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11
          cache: true
          run_install: |
            - cwd: frontend/
          package_json_file: frontend/package.json

      - name: Build frontend
        working-directory: frontend/
        run:
          pnpm build:prod

      - name: Upload Backend Jar Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend
          path: frontend/dist
          retention-days: 30

  build-backend:
    name: Build backend
    needs:
      - semantic-release
      - build-frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend
          path: /tmp/frontend-dist/

      - name: Build Backend Jar
        uses: ./.github/actions/gradle-task/
        with:
          app-version: ${{ needs.semantic-release.outputs.version }}
          task: bootJar
          task-extra-params: "-PfrontendDistDir=/tmp/frontend-dist"

      - name: Upload Backend Jar Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend
          path: backend/build/libs/
          retention-days: 30

  build-openapi:
    name: Build OpenAPI document
    needs:
      - semantic-release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate OpenAPI JSON
        uses: ./.github/actions/gradle-task/
        with:
          app-version: ${{ needs.semantic-release.outputs.version }}
          task: buildOpenApiArtifacts

      - name: Upload Nightly OpenAPI Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi
          path: backend/build/openapi/
          retention-days: 30

  attach-to-release:
    name: Attach jar to Draft Release
    needs:
      - semantic-release
      - build-frontend
      - build-backend
      - build-openapi
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Attach to Release
        run:
          ls

      # Write to release generated